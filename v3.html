<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Talker V3 – Hươu cao cổ biết nói</title>
    <meta name="description" content="Ghi âm giọng nói và xem chú hươu cao cổ 3D nói lại với chuyển động khớp theo giọng." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦒</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-version="v3">
    <div id="bg" aria-hidden="true"></div>
    <div id="bgVideoWrap" class="bg-video" aria-hidden="true" hidden>
      <div id="bgVideoBlur" class="bg-video-blur"></div>
      <video id="bgVideo" playsinline muted loop preload="auto"></video>
      <div id="ytHost" class="yt-host" hidden></div>
    </div>
    <canvas id="spectrum" class="spectrum" aria-hidden="true"></canvas>
    <canvas id="scene" aria-label="Hươu cao cổ 3D"></canvas>

    <button id="uiToggle" class="ui-toggle" type="button" aria-pressed="false" aria-label="Ẩn nút điều khiển" title="Ẩn/hiện nút điều khiển">
      <svg class="i-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a12.6 12.6 0 0 1-3.2 4.3M6.3 6.3A12.7 12.7 0 0 0 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 4.7-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="i-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>

    <header class="topbar">
      <div class="brand"><span class="logo">🦒</span> Talker <span class="ver">V3</span></div>
      <button id="bgBtn" class="chip" type="button" aria-expanded="false" aria-controls="bgPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m4 16 5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="15.5" cy="9" r="1.6" fill="currentColor"/></svg>
        Ảnh nền
      </button>
    </header>

    <aside id="bgPanel" class="panel" hidden>
      <div class="panel-head">
        <h2>Chọn ảnh nền</h2>
        <button id="bgClose" class="icon-btn" type="button" aria-label="Đóng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="presetGrid" class="preset-grid"></div>
      <div class="panel-row">
        <label class="btn secondary file-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tải ảnh của bạn
          <input id="bgFile" type="file" accept="image/*" />
        </label>
        <label class="color-pick spec-toggle" title="Kiểu sóng nhạc">
          <span>Sóng nhạc</span>
          <select id="specStyle" aria-label="Kiểu sóng nhạc">
            <option value="wave">Sóng phát sáng</option>
            <option value="bars">Cột trắng</option>
            <option value="off">Tắt</option>
          </select>
        </label>
        <label class="color-pick" title="Màu trơn">
          <input id="bgColor" type="color" value="#cfe8ff" />
          <span>Màu trơn</span>
        </label>
      </div>
    </aside>

    <div id="status" class="status" role="status" aria-live="polite">Nhấn <b>Ghi âm</b> và nói gì đó với hươu nhé!</div>

    <footer class="dock">
      <form id="ttForm" class="tt-row" autocomplete="off">
        <svg class="yt-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.5 2.5 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8z" fill="#ff0033"/><path d="m10 15 5.2-3L10 9z" fill="#fff"/></svg>
        <svg class="tt-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.4 7.4 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z" fill="currentColor"/></svg>
        <input id="ttUrl" type="url" inputmode="url" placeholder="Dán link TikTok hoặc YouTube" aria-label="Link video TikTok hoặc YouTube" />
        <button id="ttBtn" class="btn primary small" type="submit">Lấy video</button>
      </form>
      <div class="timeline-wrap">
        <canvas id="timeline" aria-label="Dòng thời gian bản ghi"></canvas>
        <div id="timelineEmpty" class="timeline-empty">Chưa có bản ghi</div>
      </div>
      <div class="controls">
        <button id="recBtn" class="btn rec" type="button">
          <span class="rec-icon" aria-hidden="true"></span>
          <span class="label">Ghi âm</span>
          <span id="recTime" class="time">0:00</span>
        </button>
        <button id="playBtn" class="btn primary" type="button" disabled>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <span class="label">Phát lại</span>
        </button>
        <button id="exportBtn" class="btn secondary" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 10 5-3v10l-5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="label">Xuất video</span>
        </button>
        <div class="more">
          <select id="voice" aria-label="Giọng phát lại">
            <option value="1">Giọng gốc</option>
            <option value="1.2">Giọng cao (x1.2)</option>
            <option value="1.4">Giọng chíp chíp (x1.4)</option>
            <option value="0.85">Giọng trầm (x0.85)</option>
          </select>
          <label class="btn ghost file-btn" title="Dùng file âm thanh hoặc video có sẵn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Mở file</span>
            <input id="audioFile" type="file" accept="audio/*,video/*" />
          </label>
          <a id="download" class="btn ghost" download hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m0 0-4-4m4 4 4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Lưu</span>
          </a>
        </div>
      </div>
    </footer>

    <div id="exportDlg" class="modal" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="exportTitle">Xuất video</h2>
          <button id="exportClose" class="icon-btn" type="button" aria-label="Đóng">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="fmt-row" role="radiogroup" aria-label="Khung hình">
          <label><input type="radio" name="fmt" value="720x1280" checked /><span>Dọc 9:16</span></label>
          <label><input type="radio" name="fmt" value="1280x720" /><span>Ngang 16:9</span></label>
          <label><input type="radio" name="fmt" value="1080x1080" /><span>Vuông 1:1</span></label>
        </div>
        <div class="export-preview"><canvas id="exportCanvas"></canvas></div>
        <div class="progress" aria-hidden="true"><div id="exportBar" class="bar"></div></div>
        <p id="exportMsg" class="export-msg">Video gồm ảnh nền, chú hươu 3D và âm thanh. Quá trình xuất chạy theo thời gian thực – hãy giữ màn hình sáng.</p>
        <div class="modal-actions">
          <button id="exportStart" class="btn primary" type="button">Bắt đầu xuất</button>
          <a id="exportSave" class="btn primary" hidden>Tải về</a>
          <button id="exportShare" class="btn secondary" type="button" hidden>Chia sẻ</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
