<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Talker – Hươu cao cổ biết nói</title>
    <meta name="description" content="Ghi âm giọng nói và xem chú hươu cao cổ 3D nói lại với chuyển động khớp theo giọng." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦒</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="bg" aria-hidden="true"></div>
    <canvas id="scene" aria-label="Hươu cao cổ 3D"></canvas>

    <header class="topbar">
      <div class="brand"><span class="logo">🦒</span> Talker</div>
      <button id="bgBtn" class="chip" type="button" aria-expanded="false" aria-controls="bgPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m4 16 5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="15.5" cy="9" r="1.6" fill="currentColor"/></svg>
        Ảnh nền
      </button>
    </header>

    <aside id="bgPanel" class="panel" hidden>
      <div class="panel-head">
        <h2>Chọn ảnh nền</h2>
        <button id="bgClose" class="icon-btn" type="button" aria-label="Đóng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="presetGrid" class="preset-grid"></div>
      <div class="panel-row">
        <label class="btn secondary file-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tải ảnh của bạn
          <input id="bgFile" type="file" accept="image/*" />
        </label>
        <label class="color-pick" title="Màu trơn">
          <input id="bgColor" type="color" value="#cfe8ff" />
          <span>Màu trơn</span>
        </label>
      </div>
    </aside>

    <div id="status" class="status" role="status" aria-live="polite">Nhấn <b>Ghi âm</b> và nói gì đó với hươu nhé!</div>

    <footer class="dock">
      <div class="timeline-wrap">
        <canvas id="timeline" aria-label="Dòng thời gian bản ghi"></canvas>
        <div id="timelineEmpty" class="timeline-empty">Chưa có bản ghi</div>
      </div>
      <div class="controls">
        <button id="recBtn" class="btn rec" type="button">
          <span class="rec-icon" aria-hidden="true"></span>
          <span class="label">Ghi âm</span>
          <span id="recTime" class="time">0:00</span>
        </button>
        <button id="playBtn" class="btn primary" type="button" disabled>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <span class="label">Phát lại</span>
        </button>
        <div class="more">
          <select id="voice" aria-label="Giọng phát lại">
            <option value="1">Giọng gốc</option>
            <option value="1.2">Giọng cao (x1.2)</option>
            <option value="1.4">Giọng chíp chíp (x1.4)</option>
            <option value="0.85">Giọng trầm (x0.85)</option>
          </select>
          <label class="btn ghost file-btn" title="Dùng file âm thanh có sẵn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Mở file</span>
            <input id="audioFile" type="file" accept="audio/*" />
          </label>
          <a id="download" class="btn ghost" download hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m0 0-4-4m4 4 4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Lưu</span>
          </a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
